name: Weekly refresh

# Monday 07:00 America/New_York. GitHub cron is UTC-only and does not observe
# DST, so 11:00 UTC is 07:00 EDT during the season (and 06:00 EST after
# November). The Restaurant Week season ends 2026-09-06, well inside EDT.
on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      force_menus:
        description: 'Re-download every menu PDF (catches in-place menu edits, ~10 min)'
        type: boolean
        default: false

# Never let two refreshes overlap: both would crawl nyctourism at once and
# blow through the <=1 req/sec ToS limit that src/config.py enforces per process.
concurrency:
  group: rw-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # data/raw/menus/*.pdf is gitignored (~406 MB), so a fresh checkout has
      # none of them and download_menus.py would re-fetch ~470 PDFs at the
      # mandatory <=1 req/sec (~10 min) every single run. The rolling cache key
      # means each run restores the newest cache and saves an updated one.
      # Cache ONLY the PDFs. data/raw/menus also holds three GIT-TRACKED files
      # (manifest.json, parsed.json, parsed-progress.json); caching the whole
      # directory would restore stale copies over them after checkout and
      # silently revert committed state.
      - name: Restore menu PDF cache
        uses: actions/cache@v4
        with:
          path: data/raw/menus/*.pdf
          key: rw-menus-${{ github.run_id }}
          restore-keys: |
            rw-menus-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests/

      # refresh.py runs the whole chain in order, single-threaded on purpose:
      # fetch_listing -> fetch_details -> download_menus -> parse_menus ->
      # build_db -> tag_dishes -> enrich_recognition -> fetch_outdoor_dining ->
      # (fetch_google_ratings, only with a key) -> build_venues ->
      # resolve_venues -> export_venues -> export_site_data ->
      # export_places -> diff_report. Do NOT parallelise any of it against
      # nyctourism or the S3 bucket; the throttle in src/config.py is a ToS
      # requirement.
      - name: Run refresh
        id: refresh
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.force_menus }}" = "true" ]; then ARGS="--force-menus"; fi
          python src/refresh.py $ARGS 2>&1 | tee refresh.log

      # The logic lives in src/job_summary.py, not inline here, so it can be
      # run and tested without pushing a commit and waiting for Monday. Inline
      # is how the SHORTLIST ALERTS block came to be silently skipped on every
      # run for weeks while the report printed everything else.
      - name: Build job summary
        if: always()
        run: python src/job_summary.py refresh.log >> "$GITHUB_STEP_SUMMARY"

      # The one thing NYC Tourism prohibits is hosting the exact PDFs. The repo
      # is public, so a stray `git add` of data/raw/menus would publish 470 of
      # them. Fail the run rather than commit one.
      - name: Guard — no menu PDFs may enter the repo
        run: |
          git add -An data/raw/menus 2>/dev/null | grep -i '\.pdf' && {
            echo "::error::A menu PDF would be committed. PDFs must never be hosted."
            exit 1
          }
          n=$(git ls-files | grep -ci '\.pdf$' || true)
          if [ "$n" != "0" ]; then
            echo "::error::$n PDF(s) are tracked in git. PDFs must never be hosted."
            exit 1
          fi
          echo "OK — 0 PDFs tracked."

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # refresh.log is a build artifact, never committed.
          rm -f refresh.log
          # Stage FIRST, then test. `git diff --quiet` ignores untracked files,
          # so on the first run a brand-new docs/data/restaurants.json would
          # look like "no changes" and never be committed.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          echo "Changed files:"
          git diff --cached --name-only
          git commit -m "Weekly refresh $(date -u +%Y-%m-%d): listing, menus, dashboard payload"
          # A human commit landing mid-run would make a plain push fail and
          # throw away ~10 minutes of polite crawling. Rebase and retry instead.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $i) — rebasing on origin/main"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "push failed after 3 attempts" >&2
          exit 1
